<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Cache: sempre busca versão nova -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>RAION - Monitor</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;background:#000;overflow:hidden;cursor:none;font-family:Arial,Helvetica,sans-serif}
  #stage{position:fixed;inset:0;background:#000;overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;transform:scale(1.0);transition:opacity .8s ease;pointer-events:none}
  .slide.active{opacity:1;z-index:2;animation:kenburns 10s linear forwards}
  .slide img{width:100%;height:100%;object-fit:cover;display:block}
  @keyframes kenburns{from{transform:scale(1)}to{transform:scale(1.06)}}
  /* Varredura tecnológica */
  #wipe{position:absolute;top:0;bottom:0;left:-30%;width:22%;background:linear-gradient(90deg,transparent,rgba(0,191,255,.0) 20%,rgba(0,191,255,.85) 50%,#fff 52%,rgba(0,191,255,.85) 55%,transparent);filter:blur(1px);opacity:0;z-index:10;pointer-events:none;transform:skewX(-12deg)}
  #wipe.run{animation:wipe 0.9s ease forwards}
  @keyframes wipe{0%{left:-30%;opacity:0}15%{opacity:1}85%{opacity:1}100%{left:130%;opacity:0}}
  /* Scanlines / glitch rápido */
  #scan{position:absolute;inset:0;z-index:11;pointer-events:none;opacity:0;background:repeating-linear-gradient(0deg,rgba(0,191,255,.18) 0 1px,transparent 1px 3px);mix-blend-mode:screen}
  #scan.run{animation:scan .9s steps(12) forwards}
  @keyframes scan{0%{opacity:.9}100%{opacity:0}}
  /* Barra de progresso 10s */
  #progressWrap{position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(255,255,255,.12);z-index:20}
  #progress{height:100%;width:0%;background:linear-gradient(90deg,#00BFFF,#fff,#00BFFF);box-shadow:0 0 12px #00BFFF}
  /* Pontinhos - bem discretos, quase invisíveis, aparecem no hover da parte de baixo */
  #dots{position:absolute;bottom:14px;right:16px;display:flex;gap:8px;z-index:21;opacity:0;transition:opacity .3s}
  body:hover #dots{opacity:.55}
  .dot{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.5);border:1px solid #00BFFF;cursor:pointer}
  .dot.on{background:#00BFFF;box-shadow:0 0 8px #00BFFF}
  /* ===== CANTOS INVISÍVEIS - SÓ APARECEM NO HOVER ===== */
  .corner{position:fixed;top:0;width:10vw;height:10vh;min-width:90px;min-height:70px;z-index:100;display:flex;align-items:center;justify-content:center;text-align:center;opacity:0;transition:opacity .25s ease,background .25s ease;background:rgba(0,0,0,0);border:1px solid transparent;cursor:pointer}
  .corner span{color:#fff;font-size:13px;line-height:1.3;padding:8px 10px;opacity:0;transition:opacity .25s ease;text-shadow:0 1px 4px #000}
  .corner:hover{opacity:1;background:rgba(0,0,0,.38);border-color:rgba(0,191,255,.55)}
  .corner:hover span{opacity:1}
  #cornerLeft{left:0}
  #cornerRight{right:0}
  @media (max-width:1024px){.corner span{font-size:12px}}
</style>
</head>
<body>
<div id="stage">
  <!-- Slides são montados pelo JS a partir do array SLIDES -->
  <div id="wipe"></div>
  <div id="scan"></div>
  <div id="progressWrap"><div id="progress"></div></div>
  <div id="dots"></div>
</div>

<!-- CANTO ESQUERDO: entrar em tela cheia | CANTO DIREITO: sair -->
<div id="cornerLeft" class="corner" title="Entrar em tela cheia"><span>clique para tela cheia</span></div>
<div id="cornerRight" class="corner" title="Sair da tela cheia"><span>clique para sair da tela cheia</span></div>

<script>
/*
  ============================================================
  PARA ADICIONAR NOVOS SLIDES / AVISOS NO FUTURO:
  1. Coloque a nova imagem dentro da pasta images/
     Ex: images/5.jpg
  2. Copie uma linha abaixo e mude o número:
     { src: 'images/5.jpg' },
  3. Suba a imagem + este arquivo para o GitHub.
  4. Recarregue a página na academia - o cache já é ignorado.
  ============================================================
*/
const SLIDES = [
  { src: 'images/1.jpg' },
  { src: 'images/2.jpg' },
  { src: 'images/3.jpg' },
  { src: 'images/4.jpg' },
];
const TEMPO_SLIDE = 10000; // 10 segundos
const stage = document.getElementById('stage');
const wipe = document.getElementById('wipe');
const scan = document.getElementById('scan');
const progress = document.getElementById('progress');
const dotsEl = document.getElementById('dots');
let atual = 0, timer = null, progressTimer = null, startTime = 0;

// Monta os slides - com cache-buster para sempre pegar imagem nova
SLIDES.forEach((s, i) => {
  const d = document.createElement('div');
  d.className = 'slide' + (i === 0 ? ' active' : '');
  const img = document.createElement('img');
  // ?v=timestamp = ignora cache antigo
  img.src = s.src + '?v=' + Date.now();
  img.alt = '';
  // Pré-carrega sem cache
  fetch(s.src, { cache: 'no-store' }).catch(()=>{});
  d.appendChild(img);
  stage.insertBefore(d, wipe);
  const dot = document.createElement('div');
  dot.className = 'dot' + (i === 0 ? ' on' : '');
  dot.onclick = (e) => { e.stopPropagation(); irPara(i); };
  dotsEl.appendChild(dot);
});
const slides = document.querySelectorAll('.slide');
const dots = document.querySelectorAll('.dot');

function mostrar(i){
  slides.forEach((el, k) => el.classList.toggle('active', k === i));
  dots.forEach((el, k) => el.classList.toggle('on', k === i));
  // Efeito tecnológico
  wipe.classList.remove('run'); scan.classList.remove('run');
  void wipe.offsetWidth; void scan.offsetWidth;
  wipe.classList.add('run'); scan.classList.add('run');
}
function irPara(i){
  atual = i; mostrar(atual); reiniciar();
}
function proximo(){
  atual = (atual + 1) % SLIDES.length;
  mostrar(atual); reiniciar();
}
function reiniciar(){
  clearInterval(timer); clearInterval(progressTimer);
  startTime = Date.now();
  progress.style.width = '0%';
  progressTimer = setInterval(() => {
    const p = Math.min(100, ((Date.now() - startTime) / TEMPO_SLIDE) * 100);
    progress.style.width = p + '%';
  }, 100);
  timer = setTimeout(proximo, TEMPO_SLIDE);
}

// Tela cheia
function entrarFullscreen(){
  const el = document.documentElement;
  if (document.fullscreenElement) return;
  if (el.requestFullscreen) el.requestFullscreen().catch(()=>{});
  else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
}
function sairFullscreen(){
  if (document.exitFullscreen) document.exitFullscreen().catch(()=>{});
}
document.getElementById('cornerLeft').addEventListener('click', entrarFullscreen);
document.getElementById('cornerRight').addEventListener('click', sairFullscreen);
// Tenta entrar sozinho ao carregar. Se o navegador bloquear, NÃO mostra nada - é só passar o mouse no canto esquerdo.
window.addEventListener('load', () => { setTimeout(entrarFullscreen, 300); });
// Cursor some após 3s parado
let hideCursor;
document.addEventListener('mousemove', () => {
  document.body.style.cursor = 'auto';
  clearTimeout(hideCursor);
  hideCursor = setTimeout(() => { document.body.style.cursor = 'none'; }, 3000);
});
reiniciar();
</script>
</body>
</html>
